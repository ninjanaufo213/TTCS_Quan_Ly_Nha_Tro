noti.viewing.rejected.title=Từ chối lịch xem phòng
noti.viewing.rejected.message=Rất tiếc, chủ trọ đã từ chối yêu cầu xem phòng {0} của bạn.

# Contract - Hợp đồng
noti.contract.requested.title=Yêu cầu xác nhận hợp đồng
noti.contract.requested.message=Chủ trọ vừa gửi cho bạn một bản hợp đồng thuê phòng {0}. Hãy kiểm tra kỹ các thông tin và xác nhận nhé!

noti.contract.confirmed.title=Hợp đồng đã được xác nhận
noti.contract.confirmed.message=Khách thuê đã xác nhận hợp đồng thuê phòng {0}.

noti.contract.canceled.title=Hủy yêu cầu hợp đồng
noti.contract.canceled.message=Khách thuê đã từ chối yêu cầu hợp đồng phòng {0}.

