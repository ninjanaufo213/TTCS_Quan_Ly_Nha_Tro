noti.viewing.requested.message=Khách thuê {0} vừa đặt lịch hẹn xem phòng {1}. Vui lòng kiểm tra và phản hồi sớm!

noti.viewing.canceled.title=Lịch xem phòng đã bị hủy
noti.viewing.canceled.message=Khách thuê {0} đã hủy lịch xem phòng {1}.

noti.viewing.canceled_by_landlord.title=Hủy lịch xem phòng
