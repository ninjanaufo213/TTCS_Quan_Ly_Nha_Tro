noti.contract.created.message=Chủ trọ đã thiết lập hợp đồng thuê phòng cho phòng {0}. Vui lòng kiểm tra lại thông tin hợp đồng trên hệ thống.

noti.contract.updated.title=Cập nhật hợp đồng
noti.contract.updated.message=Chủ trọ vừa cập nhật thông tin hợp đồng phòng {0}. Bạn có thể xem lại chi tiết.

noti.contract.terminated.title=Chấm dứt hợp đồng
noti.contract.terminated.message=Chủ trọ đã chấm dứt hợp đồng thuê phòng {0}.

