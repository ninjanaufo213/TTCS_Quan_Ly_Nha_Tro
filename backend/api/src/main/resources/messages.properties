noti.invoice.proof_approved.message=Chủ trọ đã duyệt thanh toán hóa đơn phòng {0} (Tháng {1}) của bạn.

noti.invoice.proof_rejected.title=Thanh toán bị từ chối
noti.invoice.proof_rejected.message=Chủ trọ đã từ chối minh chứng thanh toán hóa đơn phòng {0} (Tháng {1}). Vui lòng kiểm tra lại.

