# Application configuration
spring.application.name=api

# Database configuration
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/MotelManagement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=Jellalaz
spring.datasource.password=Qn6starz@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.id.new_generator_mappings=false
# Jackson configuration - Convert camelCase to snake_case
spring.jackson.property-naming-strategy=SNAKE_CASE

# File upload
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# eSMS (https://esms.vn) - SMS notifications
# Turn on after filling api-key/secret-key/send-url/brand-name
esms.enabled=false
esms.send-url=
esms.api-key=
esms.secret-key=
esms.brand-name=
esms.sms-type=2
esms.unicode=true
esms.normalize-vn-phone=true
esms.viewing-approved-template=Yeu cau xem phong {roomName} da duoc chu tro chap nhan. Thoi gian: {visitDate} {visitTime}.
# Frontend redirect
app.frontend.base-url=http://localhost:3000

# OAuth2 (Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Gemini AI
gemini.api-key=${GEMINI_API_KEY:dummy}
